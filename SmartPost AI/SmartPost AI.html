<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartPost AI - Automated Content Generation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0f172a; color: #f8fafc; min-height: 100vh; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; }
        .output-box { background: rgba(15, 23, 42, 0.5); border-radius: 12px; height: 350px; overflow-y: auto; padding: 1.5rem; color: #cbd5e1; font-size: 0.9rem; line-height: 1.6; border: 1px solid rgba(255, 255, 255, 0.05); }
        .input-style { background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 12px; width: 100%; outline: none; transition: all 0.2s; }
        .input-style:focus { border-color: #6366f1; box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2); }
        .item-card:hover { background: rgba(99, 102, 241, 0.1); border-color: rgba(99, 102, 241, 0.4); }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-[1600px] mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <div class="lg:col-span-3 space-y-6">
            <div class="glass p-6">
                <h1 class="text-xl font-black text-indigo-400 mb-6 flex items-center gap-2">
                    <i class="fa-solid fa-robot"></i> SMARTPOST AI
                </h1>
                <div class="space-y-4">
                    <div>
                        <label class="text-[10px] font-bold uppercase text-slate-500">Main Idea</label>
                        <textarea id="ideaInput" rows="3" class="input-style mt-1 text-sm" placeholder="Your idea..."></textarea>
                    </div>
                    <div>
                        <label class="text-[10px] font-bold uppercase text-slate-500">Brand Voice</label>
                        <select id="toneInput" class="input-style mt-1 text-sm cursor-pointer">
                            <option value="Professional & Bold">Professional & Bold</option>
                            <option value="Witty / Viral">Witty / Viral</option>
                            <option value="Educational & Detailed">Educational & Detailed</option>
                            <option value="Motivational & Gritty">Motivational & Gritty</option>
                            <option value="Sarcastic & Funny">Sarcastic & Funny</option>
                            <option value="Minimalist & Clean">Minimalist & Clean</option>
                        </select>
                    </div>
                    <button onclick="generate()" id="mainBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 py-4 rounded-xl font-bold transition-all shadow-lg flex justify-center items-center gap-2">
                        <span>GENERATE PACK</span> <i class="fa-solid fa-wand-sparkles"></i>
                    </button>
                </div>
            </div>

            <div class="glass p-4 h-[450px] flex flex-col">
                <div class="flex gap-2 mb-4">
                    <button onclick="switchTab('history')" id="tabHist" class="flex-1 py-2 text-[10px] font-bold uppercase rounded-lg bg-indigo-600 text-white">History</button>
                    <button onclick="switchTab('bookmarks')" id="tabBook" class="flex-1 py-2 text-[10px] font-bold uppercase rounded-lg bg-slate-800 text-slate-400">Bookmarks</button>
                </div>
                
                <div id="historyList" class="flex-grow overflow-y-auto space-y-2 pr-1"></div>
                <div id="bookmarkList" class="hidden flex-grow overflow-y-auto space-y-2 pr-1"></div>
            </div>
        </div>

        <div class="lg:col-span-9 space-y-6">
            <div class="glass p-6 relative">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-[10px] font-black uppercase text-blue-400 tracking-widest flex items-center gap-2">
                        <i class="fa-brands fa-linkedin"></i> LinkedIn Post
                    </h3>
                    <button onclick="toggleBookmark()" id="bookBtn" class="text-slate-500 hover:text-yellow-400 transition-all text-xl">
                        <i class="fa-regular fa-bookmark"></i>
                    </button>
                </div>
                <div id="linkedin" class="output-box" style="height: 250px;"></div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="glass p-5">
                    <h3 class="text-[10px] font-black uppercase text-slate-100 mb-3 tracking-widest"><i class="fa-brands fa-x-twitter"></i> Twitter</h3>
                    <div id="twitter" class="output-box" style="height: 250px;"></div>
                </div>
                <div class="glass p-5">
                    <h3 class="text-[10px] font-black uppercase text-pink-400 mb-3 tracking-widest"><i class="fa-brands fa-instagram"></i> Instagram</h3>
                    <div id="instagram" class="output-box" style="height: 250px;"></div>
                </div>
                <div class="glass p-5">
                    <h3 class="text-[10px] font-black uppercase text-emerald-400 mb-3 tracking-widest"><i class="fa-solid fa-pen-nib"></i> Blog</h3>
                    <div id="blog" class="output-box" style="height: 250px;"></div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="w-full text-center mt-6 pb-6">
        <p class="text-slate-500 text-[10px] uppercase font-bold tracking-[0.2em]">SmartPost AI: Automated Professional Content Generation with Data Logging</p>
    </div>

    <script>
        const WEBHOOK = "http://localhost:5678/webhook-test/generate-content";
        let currentData = null;

        function switchTab(tab) {
            const hist = document.getElementById('historyList');
            const book = document.getElementById('bookmarkList');
            const tH = document.getElementById('tabHist');
            const tB = document.getElementById('tabBook');
            if(tab === 'history') {
                hist.classList.remove('hidden'); book.classList.add('hidden');
                tH.className = "flex-1 py-2 text-[10px] font-bold uppercase rounded-lg bg-indigo-600 text-white";
                tB.className = "flex-1 py-2 text-[10px] font-bold uppercase rounded-lg bg-slate-800 text-slate-400";
            } else {
                hist.classList.add('hidden'); book.classList.remove('hidden');
                tB.className = "flex-1 py-2 text-[10px] font-bold uppercase rounded-lg bg-indigo-600 text-white";
                tH.className = "flex-1 py-2 text-[10px] font-bold uppercase rounded-lg bg-slate-800 text-slate-400";
            }
        }

        function renderList(storageKey, elementId, isBookmark = false) {
            const list = JSON.parse(localStorage.getItem(storageKey) || '[]');
            document.getElementById(elementId).innerHTML = list.map((item, index) => `
                <div class="item-card p-3 bg-slate-800/50 border border-white/5 rounded-lg mb-2 flex justify-between items-center group transition-all">
                    <div onclick="loadItem('${storageKey}', ${index})" class="cursor-pointer flex-1 overflow-hidden">
                        <p class="font-bold text-indigo-300 truncate text-[11px]">${item.idea}</p>
                        <p class="opacity-40 text-[9px]">${item.timestamp}</p>
                    </div>
                    ${isBookmark ? `<button onclick="deleteBookmark(${index})" class="text-slate-600 hover:text-red-400 ml-2 opacity-0 group-hover:opacity-100 transition-all"><i class="fa-solid fa-trash"></i></button>` : ''}
                </div>
            `).join('');
        }

        function loadItem(key, index) {
            const list = JSON.parse(localStorage.getItem(key) || '[]');
            const item = list[index];
            if (!item) return;
            currentData = item;
            document.getElementById('ideaInput').value = item.idea;
            document.getElementById('toneInput').value = item.tone || "Professional & Bold";
            document.getElementById('linkedin').innerText = item.linkedin;
            document.getElementById('twitter').innerText = item.twitter;
            document.getElementById('instagram').innerText = item.instagram;
            document.getElementById('blog').innerText = item.blog;
            checkBookmarkStatus();
        }

        function toggleBookmark() {
            if(!currentData) return alert("Generate something first!");
            let bookmarks = JSON.parse(localStorage.getItem('studio_bookmarks_v2') || '[]');
            const exists = bookmarks.findIndex(b => b.idea === currentData.idea);
            if(exists > -1) { bookmarks.splice(exists, 1); } 
            else { bookmarks.unshift({...currentData, timestamp: new Date().toLocaleString()}); }
            localStorage.setItem('studio_bookmarks_v2', JSON.stringify(bookmarks));
            renderList('studio_bookmarks_v2', 'bookmarkList', true);
            checkBookmarkStatus();
        }

        function deleteBookmark(index) {
            let bookmarks = JSON.parse(localStorage.getItem('studio_bookmarks_v2') || '[]');
            bookmarks.splice(index, 1);
            localStorage.setItem('studio_bookmarks_v2', JSON.stringify(bookmarks));
            renderList('studio_bookmarks_v2', 'bookmarkList', true);
            checkBookmarkStatus();
        }

        function checkBookmarkStatus() {
            if(!currentData) return;
            let bookmarks = JSON.parse(localStorage.getItem('studio_bookmarks_v2') || '[]');
            const exists = bookmarks.some(b => b.idea === currentData.idea);
            document.getElementById('bookBtn').innerHTML = exists ? `<i class="fa-solid fa-bookmark text-yellow-400"></i>` : `<i class="fa-regular fa-bookmark"></i>`;
        }

        async function generate() {
            const idea = document.getElementById('ideaInput').value;
            const tone = document.getElementById('toneInput').value;
            const btn = document.getElementById('mainBtn');
            if(!idea) return alert("Enter an idea!");
            btn.disabled = true;
            btn.innerHTML = `<span>GENERATING...</span> <i class="fa-solid fa-spinner animate-spin"></i>`;
            try {
                const res = await fetch(WEBHOOK, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ idea, tone }) });
                const raw = await res.json();
                const data = Array.isArray(raw) ? raw[0] : raw;
                currentData = { idea, tone, linkedin: data.linkedin, twitter: data.twitter, instagram: data.instagram, blog: data.blog };
                document.getElementById('linkedin').innerText = data.linkedin;
                document.getElementById('twitter').innerText = data.twitter;
                document.getElementById('instagram').innerText = data.instagram;
                document.getElementById('blog').innerText = data.blog;
                let history = JSON.parse(localStorage.getItem('studio_history_v2') || '[]');
                history.unshift({...currentData, timestamp: new Date().toLocaleTimeString()});
                localStorage.setItem('studio_history_v2', JSON.stringify(history.slice(0, 15)));
                renderList('studio_history_v2', 'historyList');
                checkBookmarkStatus();
            } catch (err) { alert("Check CORS!"); } finally { btn.disabled = false; btn.innerHTML = `<span>GENERATE PACK</span> <i class="fa-solid fa-wand-sparkles"></i>`; }
        }

        window.onload = () => {
            renderList('studio_history_v2', 'historyList');
            renderList('studio_bookmarks_v2', 'bookmarkList', true);
        };
    </script>
</body>
</html>
